name: Deploy Expo Web to GitHub Pages

on:
  push:
    branches:
      - main # Change to 'master' if your default branch uses that name

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: live-documentation/package-lock.json

      - name: Install Dependencies
        working-directory: live-documentation
        run: npm ci

      - name: Build Expo Web (Export)
        working-directory: live-documentation
        env:
          EXPO_BASE_URL: /MDATE-documentation.io
        run: npx expo export -p web

      - name: Disable Jekyll processing
        working-directory: live-documentation
        run: touch dist/.nojekyll

      - name: Fix SPA 404 Routing (Optional)
        working-directory: live-documentation
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: live-documentation/dist
          branch: gh-pages
